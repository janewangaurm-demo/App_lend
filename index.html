<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資管系器材借用系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="active">首頁</a>
    <a href="equipment.html">設備管理</a>
    <a href="loans.html">借還管理</a>
    <a href="report.html">借用統計</a>
  </nav>

  <header class="header">
    <h1>資管系器材借用系統</h1>
    <p class="tagline">借用系上器材，簡單又清楚。</p>
  </header>

  <main class="container">
    <section>
      <h2>可借用器材</h2>
      <ul class="equipment-list">
        <li class="card">
          <h3>相機</h3>
          <p>適合拍攝活動紀錄、課程作業與專題影片。</p>
        </li>
        <li class="card">
          <h3>投影機</h3>
          <p>適合課堂報告、社團活動與小型聚會播放簡報。</p>
        </li>
        <li class="card">
          <h3>麥克風</h3>
          <p>適合活動主持、演講與錄音收音。</p>
        </li>
        <li class="card">
          <h3>腳架</h3>
          <p>適合固定相機或手機，讓拍攝畫面更穩定。</p>
        </li>
      </ul>
    </section>

    <section>
      <h2>借用規則</h2>
      <ol class="rules">
        <li>每次最長可借用 7 天。</li>
        <li>請至系辦辦理借用手續。</li>
        <li>器材如有損壞，請務必告知。</li>
        <li>逾期未歸還者，將停權一個月。</li>
      </ol>
    </section>
  </main>

  <footer class="footer">
    <p>線上查詢器材狀態功能即將推出</p>
  </footer>
</body>
</html>
