<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>設備管理｜資管系器材借用系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a href="index.html">首頁</a>
    <a href="equipment.html" class="active">設備管理</a>
    <a href="loans.html">借還管理</a>
    <a href="report.html">借用統計</a>
  </nav>

  <header class="header">
    <h1>設備管理</h1>
  </header>

  <main class="container">
    <section>
      <h2>器材清單</h2>
      <p id="message" class="empty-message">載入中…</p>
      <ul id="equipment-list" class="equipment-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = "https://dbywfejnmqrnpzhsimty.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_piLcRNMih7EycEiUmK6ivQ_LMNXvfeb";

    var STATUS_CLASS = {
      "可借用": "badge-available",
      "借出中": "badge-borrowed",
      "維修中": "badge-repair",
      "報廢": "badge-retired"
    };

    var listEl = document.getElementById("equipment-list");
    var messageEl = document.getElementById("message");

    function showMessage(text) {
      messageEl.textContent = text;
      messageEl.style.display = "block";
    }

    function render(items) {
      listEl.innerHTML = "";

      items.forEach(function (item) {
        var li = document.createElement("li");
        li.className = "card";

        var head = document.createElement("div");
        head.className = "card-head";

        var title = document.createElement("h3");
        title.textContent = item.name;

        var badge = document.createElement("span");
        badge.className = "badge " + (STATUS_CLASS[item.status] || "");
        badge.textContent = item.status;

        head.appendChild(title);
        head.appendChild(badge);

        var info = document.createElement("p");
        info.textContent = "設備編號：" + item.asset_no + "　類別：" + item.category;

        li.appendChild(head);
        li.appendChild(info);
        listEl.appendChild(li);
      });
    }

    async function loadEquipment() {
      try {
        var client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        var result = await client
          .from("equipment")
          .select("asset_no, name, category, status")
          .order("asset_no", { ascending: true });

        if (result.error) {
          showMessage("無法載入設備資料，請稍後再試。");
          console.error(result.error);
          return;
        }

        if (result.data.length === 0) {
          showMessage("目前沒有設備資料。");
          return;
        }

        messageEl.style.display = "none";
        render(result.data);
      } catch (e) {
        showMessage("無法載入設備資料，請稍後再試。");
        console.error(e);
      }
    }

    loadEquipment();
  </script>
</body>
</html>
